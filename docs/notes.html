<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>笔记页面</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141417;
            --bg-tertiary: #1c1c21;
            --border-subtle: #2a2a32;
            --border-medium: #3a3a45;
            --text-primary: #e8e8ed;
            --text-secondary: #6b6b76;
            --text-muted: #4a4a55;
            --accent-primary: #00ff88;
            --accent-secondary: #00cc6a;
            --accent-glow: rgba(0, 255, 136, 0.15);
            --terminal-green: #4ade80;
            --terminal-blue: #60a5fa;
            --terminal-yellow: #fbbf24;
            --terminal-purple: #a78bfa;
            --terminal-red: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* ========== NOTES PAGE ========== */
        .notes-page {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        /* Search bar */
        .search-bar {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Notes list */
        .notes-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            min-height: 0;
        }

        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Empty state */
        .notes-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
        }

        .notes-empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .notes-empty-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .notes-empty-desc {
            font-size: 13px;
            line-height: 1.6;
            max-width: 240px;
        }

        /* Note card */
        .note-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .note-card:hover {
            border-color: var(--border-medium);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .note-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), transparent);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .note-card:hover::before {
            opacity: 1;
        }

        .note-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .note-card-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
            margin-right: 8px;
        }

        .note-card-menu {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .note-card-menu:hover {
            background: var(--border-subtle);
            color: var(--text-primary);
        }

        .note-card-preview {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-subtle);
        }

        .note-card-type {
            display: inline-flex;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .note-card-type.link {
            color: var(--terminal-blue);
        }

        .note-card-type.image {
            color: var(--terminal-yellow);
        }

        .note-card-type.text {
            color: var(--terminal-purple);
        }

        .note-card-date {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .note-card-images {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .note-card-image {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
        }

        /* Drag overlay */
        .drag-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 255, 136, 0.05);
            border: 2px dashed var(--accent-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .drag-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .drag-overlay-icon {
            font-size: 48px;
            color: var(--accent-primary);
            margin-bottom: 16px;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .drag-overlay-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .drag-overlay-desc {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Note drawer */
        .note-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .note-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .note-modal-content {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background: var(--bg-secondary);
            border-radius: 16px 16px 0 0;
            border: 1px solid var(--border-subtle);
            border-bottom: none;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .note-modal.active .note-modal-content {
            transform: translateY(0);
        }

        .note-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--bg-tertiary);
            flex-shrink: 0;
            height: 44px;
        }

        .note-modal-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            outline: none;
            border: none;
            background: transparent;
            font-family: 'IBM Plex Sans', sans-serif;
        }

        .note-modal-close {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.2s ease;
            margin-left: 12px;
        }

        .note-modal-close:hover {
            background: var(--border-subtle);
            color: var(--text-primary);
        }

        .note-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .note-modal-images {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .note-modal-image {
            width: 100%;
            max-width: 180px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
        }

        .note-modal-content-text {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-primary);
        }

        .note-modal-content-text a {
            color: var(--terminal-blue);
            text-decoration: none;
        }

        .note-modal-content-text a:hover {
            text-decoration: underline;
        }

        .note-modal-source {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
            font-size: 12px;
            color: var(--text-muted);
        }

        .note-modal-source a {
            color: var(--terminal-blue);
            text-decoration: none;
        }

        .note-modal-source a:hover {
            text-decoration: underline;
        }

        /* Text editor */
        .text-editor {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .text-editor:focus {
            border-color: var(--accent-primary);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 24px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            border-color: var(--accent-primary);
        }

        .toast.error {
            border-color: var(--terminal-red);
        }
    </style>
</head>
<body>
    <div class="notes-page">
        <div class="search-bar">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="searchInput" placeholder="搜索笔记...">
            </div>
        </div>
        <div class="notes-list" id="notesList">
            <div class="notes-empty">
                <div class="notes-empty-icon">📝</div>
                <div class="notes-empty-title">暂无笔记</div>
                <div class="notes-empty-desc">拖拽链接、文字或图片到这里创建笔记</div>
            </div>
        </div>
        <div class="drag-overlay" id="dragOverlay">
            <div class="drag-overlay-icon">📥</div>
            <div class="drag-overlay-text">释放以创建笔记</div>
            <div class="drag-overlay-desc">支持链接、文字、图片</div>
        </div>
    </div>

    <!-- Note Drawer -->
    <div class="note-modal" id="noteModal">
        <div class="note-modal-content">
            <div class="note-modal-header">
                <input type="text" class="note-modal-title" id="noteModalTitle" placeholder="笔记标题" readonly>
                <button class="note-modal-close" id="noteModalClose">×</button>
            </div>
            <div class="note-modal-body" id="noteModalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== NOTE MANAGEMENT ==========
        let notes = [];
        let currentNoteId = null;

        const notesPageElement = document.querySelector('.notes-page');
        const dragOverlay = document.getElementById('dragOverlay');
        const notesList = document.getElementById('notesList');
        const searchInput = document.getElementById('searchInput');
        const noteModal = document.getElementById('noteModal');
        const noteModalTitle = document.getElementById('noteModalTitle');
        const noteModalBody = document.getElementById('noteModalBody');
        const noteModalClose = document.getElementById('noteModalClose');
        const toast = document.getElementById('toast');

        let draggedData = null;

        // ========== DRAG AND DROP ==========
        notesPageElement.addEventListener('dragover', (e) => {
            e.preventDefault();
            dragOverlay.classList.add('active');
        });

        notesPageElement.addEventListener('dragleave', (e) => {
            if (e.target === dragOverlay) {
                dragOverlay.classList.remove('active');
            }
        });

        notesPageElement.addEventListener('drop', (e) => {
            e.preventDefault();
            dragOverlay.classList.remove('active');

            const items = e.dataTransfer.items;
            if (items) {
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.kind === 'string') {
                        item.getAsString((data) => {
                            handleDroppedData(data, 'text');
                        });
                    } else if (item.kind === 'file') {
                        const file = item.getAsFile();
                        handleDroppedFile(file);
                    }
                }
            }
        });

        function handleDroppedData(data, type) {
            // Check if it's a URL
            const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/;
            const isUrl = urlRegex.test(data);

            if (isUrl) {
                createLinkNote(data);
            } else {
                createTextNote(data);
            }
        }

        function handleDroppedFile(file) {
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    createImageNote(e.target.result, file.name);
                };
                reader.readAsDataURL(file);
            } else {
                showToast('不支持的文件类型', 'error');
            }
        }

        function createLinkNote(url) {
            const note = {
                id: generateId(),
                type: 'link',
                title: '加载中...',
                content: '',
                sourceUrl: url,
                images: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            notes.unshift(note);
            renderNotes();
            showToast('正在解析链接...', 'success');

            // Simulate link parsing (in real app, you'd use a backend service)
            setTimeout(() => {
                note.title = '网页标题 - ' + new Date().toLocaleDateString();
                note.content = '这是从链接抓取的内容摘要。在实际应用中，这里会显示网页的正文内容...';
                note.images = [
                    'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzJhMmEzMiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI0IiBmaWxsPSIjNmI2Yjc2Ij5JbWFnZSAxPC90ZXh0Pjwvc3ZnPg==',
                    'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgZmlsbD0iIzJhMmEzMiIvPjx0ZXh0IHg9IjUwJSIgeT0iNTAlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXNpemU9IjI0IiBmaWxsPSIjNmI2Yjc2Ij5JbWFnZSAyPC90ZXh0Pjwvc3ZnPg=='
                ];
                note.updatedAt = new Date().toISOString();
                renderNotes();
                showToast('笔记创建成功', 'success');
            }, 1000);
        }

        function createImageNote(imageData, fileName) {
            const note = {
                id: generateId(),
                type: 'image',
                title: fileName || '图片笔记',
                content: '',
                images: [imageData],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            notes.unshift(note);
            renderNotes();
            showToast('图片笔记创建成功', 'success');
        }

        function createTextNote(text) {
            const note = {
                id: generateId(),
                type: 'text',
                title: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
                content: text,
                images: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            notes.unshift(note);
            renderNotes();
            showToast('文字笔记创建成功', 'success');
        }

        function renderNotes(filter = '') {
            const filteredNotes = notes.filter(note => {
                if (!filter) return true;
                const searchLower = filter.toLowerCase();
                return note.title.toLowerCase().includes(searchLower) ||
                       note.content.toLowerCase().includes(searchLower);
            });

            if (filteredNotes.length === 0) {
                notesList.innerHTML = `
                    <div class="notes-empty">
                        <div class="notes-empty-icon">📝</div>
                        <div class="notes-empty-title">${filter ? '未找到匹配的笔记' : '暂无笔记'}</div>
                        <div class="notes-empty-desc">${filter ? '尝试其他关键词' : '拖拽链接、文字或图片到这里创建笔记'}</div>
                    </div>
                `;
                return;
            }

            notesList.innerHTML = filteredNotes.map(note => `
                <div class="note-card" data-id="${note.id}">
                    <div class="note-card-header">
                        <div class="note-card-title">${escapeHtml(note.title)}</div>
                        <button class="note-card-menu" data-id="${note.id}">⋮</button>
                    </div>
                    ${note.content ? `<div class="note-card-preview">${escapeHtml(note.content)}</div>` : ''}
                    ${note.images.length > 0 ? `
                        <div class="note-card-images">
                            ${note.images.slice(0, 3).map(img => `<img src="${img}" class="note-card-image" alt="Note image">`).join('')}
                        </div>
                    ` : ''}
                    <div class="note-card-footer">
                        <span class="note-card-type ${note.type}">
                            #${note.type === 'link' ? '链接' : note.type === 'image' ? '图片' : '文字'}
                        </span>
                        <span class="note-card-date">${formatDate(note.createdAt)}</span>
                    </div>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.note-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.classList.contains('note-card-menu')) {
                        e.stopPropagation();
                        return;
                    }
                    const noteId = card.dataset.id;
                    openNoteModal(noteId);
                });
            });
        }

        function openNoteModal(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;

            currentNoteId = noteId;
            noteModalTitle.value = note.title;

            let bodyHtml = '';

            if (note.type === 'link') {
                bodyHtml = `
                    ${note.images.length > 0 ? `
                        <div class="note-modal-images">
                            ${note.images.map(img => `<img src="${img}" class="note-modal-image" alt="Note image">`).join('')}
                        </div>
                    ` : ''}
                    <div class="note-modal-content-text">
                        <p>${escapeHtml(note.content)}</p>
                    </div>
                    ${note.sourceUrl ? `
                        <div class="note-modal-source">
                            来源: <a href="${note.sourceUrl}" target="_blank">${escapeHtml(note.sourceUrl)}</a>
                        </div>
                    ` : ''}
                `;
            } else if (note.type === 'image') {
                bodyHtml = `
                    <div class="note-modal-images">
                        ${note.images.map(img => `<img src="${img}" class="note-modal-image" alt="Note image">`).join('')}
                    </div>
                `;
            } else if (note.type === 'text') {
                bodyHtml = `
                    <textarea class="text-editor" id="noteEditor">${escapeHtml(note.content)}</textarea>
                `;
            }

            noteModalBody.innerHTML = bodyHtml;
            noteModal.classList.add('active');
        }

        function closeNoteModal() {
            noteModal.classList.remove('active');
            currentNoteId = null;
        }

        noteModalClose.addEventListener('click', closeNoteModal);

        noteModal.addEventListener('click', (e) => {
            if (e.target === noteModal) {
                closeNoteModal();
            }
        });

        // ========== SEARCH ==========
        let searchTimeout;

        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderNotes(e.target.value);
            }, 300);
        });

        // ========== UTILITIES ==========
        function generateId() {
            return 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';

            return date.toLocaleDateString('zh-CN');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('active');

            setTimeout(() => {
                toast.classList.remove('active');
            }, 3000);
        }

        // Initialize
        renderNotes();
    </script>
</body>
</html>
