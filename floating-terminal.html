<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动终端工具 - Floating Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141417;
            --bg-tertiary: #1c1c21;
            --border-subtle: #2a2a32;
            --border-medium: #3a3a45;
            --text-primary: #e8e8ed;
            --text-secondary: #6b6b76;
            --text-muted: #4a4a55;
            --accent-primary: #00ff88;
            --accent-secondary: #00cc6a;
            --accent-glow: rgba(0, 255, 136, 0.15);
            --terminal-green: #4ade80;
            --terminal-blue: #60a5fa;
            --terminal-yellow: #fbbf24;
            --terminal-purple: #a78bfa;
            --terminal-red: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 120px;
            padding: 60px;
            overflow: hidden;
            position: relative;
        }

        /* Background grid pattern */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Ambient glow effects */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            pointer-events: none;
        }

        .ambient-glow-1 {
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: -200px;
            left: -200px;
        }

        .ambient-glow-2 {
            background: radial-gradient(circle, rgba(96, 165, 250, 0.1) 0%, transparent 70%);
            bottom: -200px;
            right: -200px;
        }

        /* Section labels */
        .section-label {
            position: absolute;
            top: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .section-label.left {
            left: 60px;
        }

        .section-label.right {
            right: 60px;
        }

        /* ========== FLOATING BALL ========== */
        .floating-ball {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            position: relative;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: float 3s ease-in-out infinite;
        }

        .floating-ball:hover {
            transform: scale(1.08);
            box-shadow:
                0 8px 32px rgba(0, 255, 136, 0.2),
                0 0 0 1px var(--accent-primary),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .floating-ball:active {
            cursor: grabbing;
            transform: scale(1);
            transition: none;
        }

        .floating-ball.dragging {
            animation: none;
            transition: none;
            will-change: transform;
            cursor: grabbing;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Terminal icon inside ball */
        .ball-icon {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-primary);
            text-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .floating-ball:hover .ball-icon {
            text-shadow: 0 0 30px var(--accent-glow), 0 0 60px var(--accent-glow);
        }

        /* Pulse ring effect */
        .floating-ball::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid var(--accent-primary);
            opacity: 0;
            animation: pulse-ring 2s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* Tooltip */
        .ball-tooltip {
            position: absolute;
            left: 60px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .ball-tooltip::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 10px;
            height: 10px;
            background: var(--bg-tertiary);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .floating-ball:hover .ball-tooltip {
            opacity: 1;
            transform: translateX(0);
        }

        /* ========== TERMINAL PANEL ========== */
        .terminal-panel {
            width: 320px;
            height: 660px;
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px var(--border-subtle),
                0 0 0 2px rgba(0, 0, 0, 0.5);
            position: relative;
            backdrop-filter: blur(20px);
        }

        /* Glow accent on top edge */
        .terminal-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--accent-primary) 50%,
                transparent 100%);
            opacity: 0.5;
            z-index: 1;
        }

        /* Top bar */
        .top-bar {
            height: 40px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            cursor: move;
            z-index: 1;
            min-width: 0;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .app-logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .app-logo .logo-symbol {
            color: var(--accent-primary);
            font-size: 16px;
        }

        .page-title {
            flex: 1;
            text-align: center;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 12px;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .top-bar-btn {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 12px;
            position: relative;
            flex-shrink: 0;
        }

        .top-bar-btn svg {
            width: 14px;
            height: 14px;
        }

        .top-bar-btn:hover {
            background: var(--border-subtle);
            color: var(--text-primary);
        }

        .top-bar-btn.active {
            color: var(--accent-primary);
            background: rgba(0, 255, 136, 0.1);
        }

        .top-bar-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--accent-primary);
            border-radius: 1px;
        }

        /* Tab bar - Hidden */
        .tab-bar {
            display: none;
        }

        /* Page iframe */
        .page-iframe {
            flex: 1;
            border: none;
            background: var(--bg-primary);
            width: 100%;
            height: 100%;
            display: block;
        }

        .page-iframe.hidden {
            display: none;
        }

        /* Scrollbar styling */
        .terminal-content::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .terminal-content::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 3px;
        }

        .terminal-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Terminal lines */
        .terminal-line {
            margin-bottom: 2px;
            word-wrap: break-word;
        }

        .terminal-prompt {
            color: var(--accent-primary);
        }

        .terminal-path {
            color: var(--terminal-blue);
        }

        .terminal-git {
            color: var(--terminal-purple);
        }

        .terminal-command {
            color: var(--text-primary);
        }

        .terminal-output {
            color: var(--text-secondary);
        }

        .terminal-success {
            color: var(--terminal-green);
        }

        .terminal-error {
            color: var(--terminal-red);
        }

        .terminal-warning {
            color: var(--terminal-yellow);
        }

        /* Input line */
        .input-line {
            display: flex;
            align-items: flex-start;
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .input-line-prompt {
            color: var(--accent-primary);
            margin-right: 8px;
            flex-shrink: 0;
        }

        .input-line-content {
            flex: 1;
            min-width: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .input-text {
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .input-cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--accent-primary);
            margin-left: 2px;
            animation: blink 1s step-end infinite;
            flex-shrink: 0;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hidden input for mobile keyboard */
        .hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            top: 0;
            left: 0;
            height: 0;
            width: 0;
        }

        /* Status indicator */
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-glow);
            animation: status-pulse 2s ease-in-out infinite;
        }

        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Demo info */
        .demo-info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .demo-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .demo-info kbd {
            background: var(--bg-tertiary);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
        }
    </style>
</head>
<body>
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <span class="section-label left">悬浮球形态 / Floating Ball</span>
    <span class="section-label right">终端面板形态 / Terminal Panel</span>

    <!-- Floating Ball -->
    <div class="floating-ball" id="floatingBall">
        <span class="ball-icon">&gt;_</span>
        <span class="ball-tooltip">点击展开终端</span>
    </div>

    <!-- Terminal Panel -->
    <div class="terminal-panel" id="terminalPanel">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="app-logo">
                    <span class="logo-symbol">&gt;</span>
                    <span>ITERM</span>
                </div>
            </div>
            <div class="page-title" id="pageTitle"></div>
            <div class="top-bar-right">
                <button class="top-bar-btn active" id="notesBtn" title="笔记">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </button>
                <button class="top-bar-btn" id="terminalBtn" title="终端">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                </button>
                <button class="top-bar-btn" id="settingsBtn" title="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <button class="top-bar-btn" id="expandBtn" title="展开">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <polyline points="9 21 3 21 3 15"></polyline>
                        <line x1="21" y1="3" x2="14" y2="10"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </button>
            </div>
        </div>

        

        <!-- Terminal Content -->
        <iframe class="page-iframe hidden" id="terminalIframe" src="terminal.html"></iframe>

        <!-- Notes Page -->
        <iframe class="page-iframe active" id="notesIframe" src="notes.html"></iframe>

        <!-- Settings Page -->
        <iframe class="page-iframe hidden" id="settingsIframe" src="settings.html"></iframe>
    </div>

    

    <div class="demo-info">
        <span><kbd>单击</kbd> 展开/收起</span>
        <span><kbd>输入</kbd> 命令</span>
        <span><kbd>Enter</kbd> 执行</span>
        <span><kbd>Ctrl+C</kbd> 清空</span>
    </div>

    <script>
        // Floating ball drag functionality
        const ball = document.getElementById('floatingBall');
        let isBallDragging = false;
        let ballStartX, ballStartY, ballInitialX, ballInitialY;

        ball.addEventListener('mousedown', (e) => {
            isBallDragging = true;
            ballStartX = e.clientX;
            ballStartY = e.clientY;

            // Get current position (handles both static and already positioned ball)
            const rect = ball.getBoundingClientRect();
            ballInitialX = rect.left;
            ballInitialY = rect.top;

            // Add dragging class to disable animations and transitions
            ball.classList.add('dragging');
        });

        // Terminal panel drag functionality
        const terminalPanel = document.getElementById('terminalPanel');
        const topBar = terminalPanel.querySelector('.top-bar');
        let isPanelDragging = false;
        let panelStartX, panelStartY, panelInitialX, panelInitialY;

        topBar.addEventListener('mousedown', (e) => {
            // Don't drag if clicking on buttons
            if (e.target.closest('.top-bar-btn')) {
                return;
            }
            isPanelDragging = true;
            panelStartX = e.clientX;
            panelStartY = e.clientY;
            const rect = terminalPanel.getBoundingClientRect();
            panelInitialX = rect.left;
            panelInitialY = rect.top;

            // Make panel absolute positioned for dragging
            terminalPanel.style.position = 'fixed';
            terminalPanel.style.left = panelInitialX + 'px';
            terminalPanel.style.top = panelInitialY + 'px';
            terminalPanel.style.transform = 'none';

            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            // Handle ball dragging
            if (isBallDragging) {
                const dx = e.clientX - ballStartX;
                const dy = e.clientY - ballStartY;

                // Switch to fixed positioning on first drag
                ball.style.position = 'fixed';
                ball.style.left = (ballInitialX + dx) + 'px';
                ball.style.top = (ballInitialY + dy) + 'px';
                ball.style.transform = 'none';
            }

            // Handle panel dragging
            if (isPanelDragging) {
                const dx = e.clientX - panelStartX;
                const dy = e.clientY - panelStartY;
                terminalPanel.style.left = (panelInitialX + dx) + 'px';
                terminalPanel.style.top = (panelInitialY + dy) + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isBallDragging) {
                ball.classList.remove('dragging');
            }
            isBallDragging = false;
            isPanelDragging = false;
        });

        // ========== PAGE SWITCHING ==========
        const notesBtn = document.getElementById('notesBtn');
        const terminalBtn = document.getElementById('terminalBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const pageTitle = document.getElementById('pageTitle');
        const terminalIframe = document.getElementById('terminalIframe');
        const notesIframe = document.getElementById('notesIframe');
        const settingsIframe = document.getElementById('settingsIframe');

        // Set initial page title
        pageTitle.textContent = '笔记页面';

        function switchPage(activeBtn, inactiveBtns, title, activeIframe) {
            // Update button states
            activeBtn.classList.add('active');
            inactiveBtns.forEach(btn => btn.classList.remove('active'));

            // Update page title
            pageTitle.textContent = title;

            // Update iframe visibility
            [terminalIframe, notesIframe, settingsIframe].forEach(iframe => {
                iframe.classList.add('hidden');
                iframe.classList.remove('active');
            });
            activeIframe.classList.remove('hidden');
            activeIframe.classList.add('active');
        }

        notesBtn.addEventListener('click', () => {
            switchPage(notesBtn, [terminalBtn, settingsBtn], '笔记页面', notesIframe);
        });

        terminalBtn.addEventListener('click', () => {
            switchPage(terminalBtn, [notesBtn, settingsBtn], '终端', terminalIframe);
        });

        settingsBtn.addEventListener('click', () => {
            switchPage(settingsBtn, [notesBtn, terminalBtn], '设置', settingsIframe);
        });
    </script>
</body>
</html>
