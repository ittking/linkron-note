name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macos-x86_64'
          - platform: 'windows-latest'
            args: ''
            name: 'windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build application
        run: pnpm tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
            src-tauri/target/**/bundle/macos/*.sig
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/nsis/*.sig
            src-tauri/target/**/bundle/updater/*.tar.gz
            src-tauri/target/**/bundle/updater/*.sig

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts for debugging
        run: find artifacts -type f | sort

      - name: Generate updater JSON and create release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          BASE_URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="${TAG#v}"

          # Initialize latest.json with required fields
          jq -n --arg version "$VERSION" --arg date "$PUB_DATE" \
            '{version: $version, pub_date: $date, platforms: {}}' > latest.json

          # Debug: list all artifacts
          echo "=== All artifacts ==="
          find artifacts -type f | sort
          echo "===================="

          # Process macOS ARM64
          SIG_FILE=$(find artifacts/macos-arm64 -name "*.app.tar.gz.sig" | head -1)
          TAR_FILE=$(find artifacts/macos-arm64 -name "*.app.tar.gz" -not -name "*.sig" | head -1)
          echo "macOS ARM64: SIG_FILE=$SIG_FILE TAR_FILE=$TAR_FILE"
          if [ -n "$SIG_FILE" ] && [ -n "$TAR_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
            TAR_NAME=$(basename "$TAR_FILE")
            jq --arg sig "$SIG" --arg url "${BASE_URL}/${TAR_NAME}" \
              '.platforms["darwin-aarch64"] = {"signature": $sig, "url": $url}' latest.json > tmp.json && mv tmp.json latest.json
            echo "Added darwin-aarch64 entry"
          else
            echo "WARNING: Missing .sig or .tar.gz for macOS ARM64"
          fi

          # Process macOS x86_64
          SIG_FILE=$(find artifacts/macos-x86_64 -name "*.app.tar.gz.sig" | head -1)
          TAR_FILE=$(find artifacts/macos-x86_64 -name "*.app.tar.gz" -not -name "*.sig" | head -1)
          echo "macOS x86_64: SIG_FILE=$SIG_FILE TAR_FILE=$TAR_FILE"
          if [ -n "$SIG_FILE" ] && [ -n "$TAR_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
            TAR_NAME=$(basename "$TAR_FILE")
            jq --arg sig "$SIG" --arg url "${BASE_URL}/${TAR_NAME}" \
              '.platforms["darwin-x86_64"] = {"signature": $sig, "url": $url}' latest.json > tmp.json && mv tmp.json latest.json
            echo "Added darwin-x86_64 entry"
          else
            echo "WARNING: Missing .sig or .tar.gz for macOS x86_64"
          fi

          # Process Windows (NSIS .exe)
          SIG_FILE=$(find artifacts/windows -name "*.exe.sig" | head -1)
          EXE_FILE=""
          if [ -n "$SIG_FILE" ]; then
            EXE_FILE="${SIG_FILE%.sig}"
          fi
          echo "Windows: SIG_FILE=$SIG_FILE EXE_FILE=$EXE_FILE"
          if [ -n "$SIG_FILE" ] && [ -n "$EXE_FILE" ]; then
            SIG=$(cat "$SIG_FILE")
            EXE_NAME=$(basename "$EXE_FILE")
            jq --arg sig "$SIG" --arg url "${BASE_URL}/${EXE_NAME}" \
              '.platforms["windows-x86_64"] = {"signature": $sig, "url": $url}' latest.json > tmp.json && mv tmp.json latest.json
            echo "Added windows-x86_64 entry"
          else
            echo "WARNING: Missing .sig or .exe for Windows"
          fi

          echo "=== Generated latest.json ==="
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/updater/*.tar.gz
            artifacts/**/updater/*.sig
            latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
